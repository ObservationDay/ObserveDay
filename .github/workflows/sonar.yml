name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartconseil_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartconseil_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: Front-end Angular/package-lock.json
      - name: Install Angular dependencies
        run: npm ci --ignore-scripts
        working-directory: Front-end Angular
      - name: Test Angular with coverage
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage
        working-directory: Front-end Angular
      - name: Normalize Angular coverage paths
        run: sed -i 's#^SF:src/#SF:Front-end Angular/src/#' coverage/smartconseil-frontend/lcov.info
        working-directory: Front-end Angular
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3
          coverage: pcov
      - name: Install Laravel dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: Back-end Laravel
      - name: Test Laravel with coverage
        run: |
          export APP_KEY="$(php artisan key:generate --show)"
          php artisan migrate --force
          php artisan test --coverage-clover=coverage.xml
        working-directory: Back-end Laravel
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: smartconseil_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Back-end Python/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r requirements.txt
        working-directory: Back-end Python
      - name: Test Python with coverage
        run: |
          python -m coverage run --source=participant_api -m unittest discover -s tests
          python -m coverage xml -o coverage.xml
        working-directory: Back-end Python
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
